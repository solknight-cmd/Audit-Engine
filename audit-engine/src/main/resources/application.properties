spring.application.name=audit-engine
# Server Port
server.port=8080

# Secrets come from environment variables. For local development, put them in a
# gitignored .env file next to pom.xml (see .env.example).
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/audit_vault_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Properties
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AI Audit Engine Integrations (OpenAI-compatible chat completions API)
ai.api.url=${AI_API_URL:https://api.groq.com/openai/v1}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:llama-3.3-70b-versatile}

# Demo tenants and the demo auditor login are only created when this is true
vault.seed-demo-data=${SEED_DEMO_DATA:true}

# Session cookie: SameSite=Lax stops other sites from submitting forms with a user's session
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Set the maximum allowed file size limits (e.g., 50MB per file, 50MB per request)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
