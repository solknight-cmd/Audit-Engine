spring.application.name=audit-engine
# Server Port
server.port=8080

# Secrets come from environment variables. For local development, put them in a
# gitignored .env file next to pom.xml (see .env.example).
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/audit_vault_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Properties
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AI Audit Engine Integrations
# ai.provider picks the AuditModelClient implementation (currently: groq)
ai.provider=${AI_PROVIDER:groq}
ai.api.url=${AI_API_URL:https://api.groq.com/openai/v1}
ai.api.key=${AI_API_KEY:}
# Text documents go to the text model; scanned PDFs and photos go to the vision model
ai.api.model=${AI_API_MODEL:openai/gpt-oss-120b}
ai.api.vision-model=${AI_API_VISION_MODEL:qwen/qwen3.8-27b}
# Longer documents are cut to this many characters (the report records that it was cut)
ai.max-input-chars=30000
# Groq's vision model accepts at most 3 images per request
ai.max-images=3
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=120s

# Demo tenants and the demo auditor login are only created when this is true
vault.seed-demo-data=${SEED_DEMO_DATA:true}

# Session cookie: SameSite=Lax stops other sites from submitting forms with a user's session
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Set the maximum allowed file size limits (e.g., 50MB per file, 50MB per request)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
