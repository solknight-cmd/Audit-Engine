<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Audit Intelligence | Set Your Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        'surface-dark': '#0B0F19',
                        'card-dark': '#111827',
                        'border-gold': '#AA8020'
                    }
                }
            }
        }
    </script>
    <script src="/js/vault-api.js"></script>
</head>
<body class="bg-surface-dark text-white font-sans min-h-screen flex items-center justify-center relative overflow-hidden">

<div class="absolute top-0 left-0 w-96 h-96 bg-gold/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-gold/5 rounded-full blur-3xl pointer-events-none"></div>

<div class="w-full max-w-md p-8 bg-card-dark rounded-xl border border-white/10 shadow-2xl relative z-10 mx-4">

    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gold/10 border border-gold/30 text-gold mb-3 text-2xl font-serif">V</div>
        <h1 id="pageTitle" class="text-2xl font-bold tracking-tight text-gold font-serif">SET YOUR PASSWORD</h1>
        <p id="pageSubtitle" class="text-xs text-slate-400 mt-2">Checking your link…</p>
    </div>

    <!-- Shown when the link is missing, expired or already used -->
    <div id="invalidBanner" class="hidden p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-xs"></div>

    <form id="passwordForm" class="hidden space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gold mb-2">Email</label>
            <div id="emailDisplay" class="w-full px-4 py-3 bg-surface-dark/60 border border-white/5 rounded-lg text-slate-300 text-sm font-mono"></div>
        </div>
        <div id="nameField">
            <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-gold mb-2">Your Name</label>
            <input id="fullName" name="fullName" required autocomplete="name"
                   class="w-full px-4 py-3 bg-surface-dark border border-white/10 rounded-lg focus:outline-none focus:border-gold/50 text-slate-200 text-sm">
        </div>
        <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gold mb-2">New Password</label>
            <input id="password" name="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password"
                   class="w-full px-4 py-3 bg-surface-dark border border-white/10 rounded-lg focus:outline-none focus:border-gold/50 text-slate-200 text-sm">
            <p class="text-[11px] text-slate-500 mt-1">At least 10 characters. A short phrase is easier to remember and harder to guess.</p>
        </div>
        <div>
            <label for="confirm" class="block text-xs font-semibold uppercase tracking-wider text-gold mb-2">Repeat Password</label>
            <input id="confirm" name="confirm" type="password" required autocomplete="new-password"
                   class="w-full px-4 py-3 bg-surface-dark border border-white/10 rounded-lg focus:outline-none focus:border-gold/50 text-slate-200 text-sm">
        </div>
        <p id="formError" class="text-xs text-red-400"></p>
        <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-border-gold to-gold hover:from-gold hover:to-border-gold text-surface-dark font-bold text-sm uppercase tracking-widest rounded-lg shadow-lg transition-all duration-200">
            Save Password
        </button>
    </form>
</div>

<script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('passwordForm');

    function showInvalid(message) {
        document.getElementById('pageSubtitle').textContent = '';
        const banner = document.getElementById('invalidBanner');
        banner.textContent = message;
        banner.classList.remove('hidden');
    }

    async function loadLink() {
        if (!token) {
            showInvalid('This link is missing its code. Open the full link you were sent.');
            return;
        }
        try {
            const info = await fetchJson('/api/v1/auth/token?token=' + encodeURIComponent(token));
            const isInvite = info.purpose === 'INVITE';
            document.getElementById('pageTitle').textContent = isInvite ? 'WELCOME TO VAULT CORE' : 'RESET YOUR PASSWORD';
            document.getElementById('pageSubtitle').textContent = isInvite
                ? `Choose a password to join ${info.companyName}.`
                : `Choose a new password for your ${info.companyName} account.`;
            document.getElementById('emailDisplay').textContent = info.email;
            document.getElementById('fullName').value = info.fullName || '';
            document.getElementById('nameField').classList.toggle('hidden', !isInvite);
            document.getElementById('fullName').required = isInvite;
            form.classList.remove('hidden');
        } catch (e) {
            showInvalid(e.message);
        }
    }

    // Public endpoints: plain fetch, with the CSRF header for the POST (cookie set when this page loaded)
    async function fetchJson(url, options = {}) {
        const headers = new Headers(options.headers || {});
        if (options.method === 'POST') {
            const cookie = document.cookie.split('; ').find(c => c.startsWith('XSRF-TOKEN='));
            headers.set('X-XSRF-TOKEN', cookie ? decodeURIComponent(cookie.split('=')[1]) : '');
            headers.set('Content-Type', 'application/json');
        }
        const response = await fetch(url, { ...options, headers, credentials: 'same-origin' });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(body.error || `Something went wrong (${response.status}). Try again.`);
        }
        return body;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const error = document.getElementById('formError');
        error.textContent = '';
        if (form.password.value !== form.confirm.value) {
            error.textContent = "The two passwords don't match.";
            return;
        }
        try {
            await fetchJson('/api/v1/auth/set-password', {
                method: 'POST',
                body: JSON.stringify({ token, fullName: form.fullName.value, password: form.password.value })
            });
            window.location.href = '/Login.html?passwordSet';
        } catch (e) {
            error.textContent = e.message;
        }
    });

    loadLink();
</script>
</body>
</html>
