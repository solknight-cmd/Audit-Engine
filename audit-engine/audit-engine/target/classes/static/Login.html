<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Audit Intelligence | Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        'surface-dark': '#0B0F19',
                        'card-dark': '#111827',
                        'border-gold': '#AA8020'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-dark text-white font-sans min-h-screen flex items-center justify-center relative overflow-hidden">

<div class="absolute top-0 left-0 w-96 h-96 bg-gold/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-gold/5 rounded-full blur-3xl pointer-events-none"></div>

<div class="w-full max-w-md p-8 bg-card-dark rounded-xl border border-white/10 shadow-2xl relative z-10 mx-4">

    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gold/10 border border-gold/30 text-gold mb-3 text-2xl font-serif">
            V
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-gold font-serif">VAULT AUDIT INTELLIGENCE</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Institutional Forensic Gateway</p>
    </div>

    <div id="errorBanner" class="hidden mb-6 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-xs flex items-center gap-2">
        <span>●</span> Invalid corporate credentials or domain mapping mismatch.
    </div>

    <form action="/api/v1/auth/login" method="POST" class="space-y-6">

        <div>
            <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gold mb-2">Corporate Email Address</label>
            <input
                    type="email"
                    id="username"
                    name="username"
                    required
                    placeholder="name@company.com"
                    class="w-full px-4 py-3 bg-surface-dark border border-white/10 rounded-lg focus:outline-none focus:border-gold/50 text-slate-200 text-sm transition-colors duration-200"
            >
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gold">Password</label>
                <a href="#" class="text-[10px] uppercase tracking-wider text-slate-400 hover:text-gold transition-colors">Forgot?</a>
            </div>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="••••••••"
                    class="w-full px-4 py-3 bg-surface-dark border border-white/10 rounded-lg focus:outline-none focus:border-gold/50 text-slate-200 text-sm transition-colors duration-200"
            >
        </div>

        <div class="text-[11px] text-slate-400 leading-relaxed bg-surface-dark/50 p-3 rounded border border-white/5">
            <span class="text-gold font-bold">Notice:</span> Access restricted to verified financial audit departments. Single Sign-On multi-tenant isolation rules apply automatically based on email domains.
        </div>

        <button
                type="submit"
                class="w-full py-3 bg-gradient-to-r from-border-gold to-gold hover:from-gold hover:to-border-gold text-surface-dark font-bold text-sm uppercase tracking-widest rounded-lg shadow-lg hover:shadow-gold/10 active:scale-[0.99] transition-all duration-200"
        >
            Verify Credentials
        </button>
    </form>
</div>

<script>
    if (window.location.search.includes('error')) {
        document.getElementById('errorBanner').classList.remove('hidden');
    }
</script>
</body>
</html>
